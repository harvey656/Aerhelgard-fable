<body style="background:#556;color:#fff;font:12px monospace"><script type="module">
import {makeTextures,makeAtlases,T,FLORA,PROPS} from '../src/art.js';
import {monsterSheet,humanSheet,itemIcon,weaponCanvas,portrait} from '../src/sprites.js';
import {MONSTERS} from '../src/data.js';
import {makeLook} from '../src/settlement.js';
import {RNG} from '../src/rng.js';
makeTextures(); makeAtlases();
const add=(c,s=2)=>{c.style.cssText=`image-rendering:pixelated;width:${c.width*s}px;margin:2px`;document.body.append(c)};
add(T.flora._pix.canvas(),2); add(T.props._pix.canvas(),2);
document.body.append(document.createElement('br'));
for(const id in MONSTERS) add(monsterSheet(id).pix.canvas(),2);
for(let i=0;i<10;i++){const r=new RNG(i+5);const f=r.chance(.5);add(humanSheet(makeLook(r,f,['farmer','guard','Smith','king','queen','Priest','Arcanist','noble','farmer','Innkeeper'][i],i%3),'c'+i).pix.canvas(),2);}
document.body.append(document.createElement('br'));
for(const k of ['dagger','shortsword','longsword','claymore','mace','warhammer','handaxe','battleaxe','spear','halberd','shortbow','longbow','arrow','shield','head','body','arms','legs','feet','belt','ring','amulet','potion','mushroom','berry','root','flower','leaf','pelt','part','meat','lockpick','hammer','pickaxe','mortar','torch','bread','gem','parcel','chalice','ingot','ore','tome','gold']){const im=new Image();im.src=itemIcon(k,'#b8c0cc');im.style.cssText='image-rendering:pixelated;width:48px';document.body.append(im)}
for(const k of ['longsword','battleaxe','mace','spear','longbow','shield','torch'])add(weaponCanvas(k,'#b8c0cc'),2);
for(const k of ['plaster','stone','wood','sandstone','thatch','shingle','slate','door','window','windowLit','floorwood','floorstone','cavewall','cryptwall','ruinwall','towerwall','plasterin','ceil','carpet','crate'])add(T[k].image,3);
window.done=1;
</script>
