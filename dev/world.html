<body style="margin:0;background:#000"><canvas id="view" style="width:100vw;height:100vh;image-rendering:pixelated"></canvas><script type="module">
import * as THREE from '../vendor/three.module.min.js';
import {makeTextures,makeAtlases} from '../src/art.js';
import {makeMaterials} from '../src/mats.js';
import {World} from '../src/world.js';
import {Terrain} from '../src/terrain.js';
import {initSky,updateSky} from '../src/sky.js';
import {Player} from '../src/player.js';
import {G} from '../src/state.js';
const q=new URLSearchParams(location.search);
makeTextures(); makeAtlases(); makeMaterials();
const r=G.renderer=new THREE.WebGLRenderer({canvas:document.getElementById('view'),antialias:false});
r.setSize(Math.round(innerWidth/3),Math.round(innerHeight/3),false);
const scene=G.scene=new THREE.Scene(); scene.fog=new THREE.Fog(0,10,300);
const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,3000); cam.rotation.order='YXZ';
initSky(scene);
let t=performance.now();
const W=G.world=new World(+q.get('seed')||1); console.log('world',performance.now()-t);
G.fn={msg(){},sfx(){},banner(){},flash(){}}; G.save={harvested:{}};
const P=G.player=new Player();
let L=W.start; const want=q.get('loc'); if(want) L=W.locs.find(l=>l.type===want)||L;
const dx=+q.get('dx')||0, dz=+q.get('dz')||0;
P.pos.set(L.x+dx,0,L.z+dz); G.time=(+q.get('h')||10)*3600;
const T=G.terrain=new Terrain(scene,W); t=performance.now(); T.loadAround(P.pos.x,P.pos.z); console.log('chunks',T.chunks.size,performance.now()-t,'ms',L.name,L.type);
P.pos.y=T.groundAt(P.pos.x,P.pos.z);
cam.position.set(P.pos.x,P.pos.y+1.7+(+q.get('up')||0),P.pos.z); cam.rotation.y=(+q.get('yaw')||0)*Math.PI/180; cam.rotation.x=(+q.get('pitch')||0)*Math.PI/180;
updateSky(1,scene,cam,true); T.update(P.pos.x,P.pos.z,5,G.time/3600%24>20.5||G.time/3600%24<5.5);
t=performance.now(); r.render(scene,cam); console.log('render',performance.now()-t,r.info.render.calls,'calls',r.info.render.triangles,'tris');
window.done=1;
</script>
